name: One-time prune duplicate CI workspace artifacts

on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-ci-artifacts-once.yml]

permissions:
  contents: read
  actions: write
  pull-requests: read

jobs:
  prune:
    if: ${{ github.repository == 'Dmitry-dev-pet/mermaid-compiler' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prune only superseded successful CI workspace artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, subprocess, sys
          from collections import defaultdict

          REPO = "Dmitry-dev-pet/mermaid-compiler"
          TARGET = "mermaid-chatgpt-local"
          MAX_DELETES = 25
          MIN_AGE_HOURS = 24
          now = datetime.datetime.now(datetime.timezone.utc)

          def gh(path, method="GET"):
              command = ["gh", "api"]
              if method != "GET":
                  command += ["--method", method]
              command += [path]
              p = subprocess.run(command, capture_output=True, text=True, check=True)
              return json.loads(p.stdout) if p.stdout.strip() else None

          def pages(path, key):
              items = []
              for page in range(1, 11):
                  data = gh(f"{path}{'&' if '?' in path else '?'}per_page=100&page={page}")
                  chunk = data[key]
                  items.extend(chunk)
                  if len(chunk) < 100:
                      return items
              raise RuntimeError("Refuse to run with incomplete pagination")

          artifacts = [a for a in pages(f"repos/{REPO}/actions/artifacts?name={TARGET}", "artifacts")
                       if a.get("name") == TARGET and not a.get("expired")]
          prs = pages(f"repos/{REPO}/pulls?state=open", None) if False else []
          # GET /pulls returns an array, not a wrapped response.
          for page in range(1, 11):
              chunk = gh(f"repos/{REPO}/pulls?state=open&per_page=100&page={page}")
              prs.extend(chunk)
              if len(chunk) < 100:
                  break
          else:
              raise RuntimeError("Refuse incomplete open PR pagination")
          open_heads = {pr["head"]["sha"] for pr in prs}
          runs = {}
          for a in artifacts:
              wr = a.get("workflow_run") or {}
              if not wr.get("id"):
                  raise RuntimeError("Artifact without run metadata")
              rid = int(wr["id"])
              if rid not in runs:
                  runs[rid] = gh(f"repos/{REPO}/actions/runs/{rid}")
          main = sorted(
              (r for r in runs.values() if r["name"] == "CI" and r["status"] == "completed"
               and r["conclusion"] == "success" and r["event"] == "push"
               and r["head_branch"] == "main"),
              key=lambda r: r["created_at"], reverse=True
          )
          if len(main) < 2:
              raise RuntimeError("Need at least two successful main CI runs to preserve")
          keep = {r["id"] for r in main[:2]}
          candidates = []
          for a in artifacts:
              r = runs[a["workflow_run"]["id"]]
              age = now - datetime.datetime.fromisoformat(a["created_at"].replace("Z","+00:00"))
              if age < datetime.timedelta(hours=MIN_AGE_HOURS):
                  continue
              if r["id"] in keep or r.get("head_sha") in open_heads:
                  continue
              if r["name"] != "CI" or r["status"] != "completed" or r["conclusion"] != "success":
                  continue
              if r["event"] not in ("push","pull_request"):
                  continue
              candidates.append(a)
          if len(candidates) > MAX_DELETES:
              raise RuntimeError(f"Refuse deletion count {len(candidates)} > {MAX_DELETES}")
          total = sum(a["size_in_bytes"] for a in candidates)
          print(f"Candidate count={len(candidates)}, MiB={total/1048576:.2f}, kept main runs={sorted(keep)}",flush=True)
          for a in sorted(candidates,key=lambda x:x["created_at"]):
              gh(f"repos/{REPO}/actions/artifacts/{a['id']}", "DELETE")
              print(f"DELETED id={a['id']} name={a['name']} MiB={a['size_in_bytes']/1048576:.2f}",flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write(f"Deleted {len(candidates)} superseded CI artifacts, {total/1048576:.2f} MiB. Preserved last two main CI runs and open PR heads.\n")
          PY
